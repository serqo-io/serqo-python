[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "serqo"
version = "0.1.0"
description = "Official Python client for the Serqo Search API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Serqo" }]
keywords = ["serp", "serp-api", "search-api", "google-search", "bing-search"]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://serqo.io"
Documentation = "https://github.com/serqo-io/serqo-python#readme"
Repository = "https://github.com/serqo-io/serqo-python"
Issues = "https://github.com/serqo-io/serqo-python/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
